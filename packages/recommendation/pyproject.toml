[project]
name = "ratatouille-recommendation"
version = "0.1.0"
description = "Planejador do dia por ingredientes (Montador + Avaliador) do RatatouilleAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "pytest>=8",
]
som = [
    "minisom>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratatouille_recommendation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
