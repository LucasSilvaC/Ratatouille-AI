[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ratatouille-agents"
version = "0.1.0"
description = "Agentes do RatatouilleAI. Por enquanto, a Nutripédia: RAG sobre a bibliografia de nutrição."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Dependências pesadas da Nutripédia (o sentence-transformers instala o PyTorch).
# Os testes unitários não precisam delas.
rag = ["pypdf>=4", "sentence-transformers>=3", "google-genai>=1"]
dev = ["pytest>=8"]

[project.scripts]
nutripedia = "ratatouille_agents.tools.nutripedia.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
