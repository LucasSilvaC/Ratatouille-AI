name: ratatouille-ai

services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_min_messages=fatal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ratatouille}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ratatouille}
      POSTGRES_DB: ${POSTGRES_DB:-ratatouille_ai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ratatouille}:${POSTGRES_PASSWORD:-ratatouille}@postgres:5432/${POSTGRES_DB:-ratatouille_ai}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-ratatouille}:${POSTGRES_PASSWORD:-ratatouille}@postgres:5432/${POSTGRES_DB:-ratatouille_ai}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  api-db-init:
    image: postgres:18-alpine
    command:
      - /bin/sh
      - -ec
      - |
        case "$$DJANGO_PUBLIC_DEPLOYMENT" in
          [Tt][Rr][Uu][Ee])
            case "$$PGPASSWORD" in
              ""|ratatouille|ratatouille_api)
                echo "Configure uma credencial própria em POSTGRES_PASSWORD para o modo público." >&2
                exit 1
                ;;
            esac
            case "$$DJANGO_DB_PASSWORD" in
              ""|ratatouille|ratatouille_api)
                echo "Configure uma credencial própria em DJANGO_DB_PASSWORD para o modo público." >&2
                exit 1
                ;;
            esac
            if [ "$$PGPASSWORD" = "$$DJANGO_DB_PASSWORD" ]; then
              echo "Use credenciais distintas em POSTGRES_PASSWORD e DJANGO_DB_PASSWORD." >&2
              exit 1
            fi
            ;;
        esac
        exec psql -X -v ON_ERROR_STOP=1 -f /bootstrap-api.sql
    environment:
      PGHOST: postgres
      PGDATABASE: postgres
      PGUSER: ${POSTGRES_USER:-ratatouille}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ratatouille}
      WEB_DB_NAME: ${POSTGRES_DB:-ratatouille_ai}
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-ratatouille_api}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-ratatouille_api}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:-ratatouille_api}
      DJANGO_PUBLIC_DEPLOYMENT: ${DJANGO_PUBLIC_DEPLOYMENT:-false}
    volumes:
      - ./database/bootstrap-api.sql:/bootstrap-api.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile
      target: api
    environment:
      DJANGO_DB_HOST: postgres
      DJANGO_DB_PORT: 5432
      DJANGO_DB_NAME: ${DJANGO_DB_NAME:-ratatouille_api}
      DJANGO_DB_USER: ${DJANGO_DB_USER:-ratatouille_api}
      DJANGO_DB_PASSWORD: ${DJANGO_DB_PASSWORD:-ratatouille_api}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_RESPONSE_KMS_KEY_ID: ${DJANGO_RESPONSE_KMS_KEY_ID:-}
      DJANGO_RESPONSE_PUBLIC_KEY: ${DJANGO_RESPONSE_PUBLIC_KEY:-}
      DJANGO_PUBLIC_DEPLOYMENT: ${DJANGO_PUBLIC_DEPLOYMENT:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost 127.0.0.1}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-localhost}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-true}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-webmaster@localhost}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - api-runtime-data:/data
    depends_on:
      api-db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/', timeout=3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # The first startup loads the full catalog before Gunicorn listens.
      start_period: 300s
    restart: unless-stopped

volumes:
  postgres-data:
  api-runtime-data:
